<!-- Ilustración "Registro de empresa" — Fexpo -->
<!-- Estilo: flat vector 2.0 / soft isometric, trazo navy, paleta de marca.
     Expositora presentando su stand: mostrador con laptop, tarjetas de interfaz
     flotando (perfil verificado y visitas), planta decorativa. Sin fotos ni texto. -->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 640 460"
  width="640"
  height="460"
  fill="none"
  aria-hidden="true"
>
  <defs>
    <linearGradient id="reg-panel" x1="160" y1="90" x2="480" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E7F3FF" />
      <stop offset="100%" stop-color="#A9D0FF" />
    </linearGradient>
  </defs>

  <!-- Confeti geométrico de fondo: diamantes sueltos, muy sutiles -->
  <g opacity="0.9">
    <rect x="-7" y="-7" width="14" height="14" rx="3" fill="#A9D0FF" opacity="0.35" transform="translate(68,58) rotate(45)" />
    <rect x="-6" y="-6" width="12" height="12" rx="3" fill="#1479F5" opacity="0.22" transform="translate(596,332) rotate(45)" />
    <rect x="-5" y="-5" width="10" height="10" rx="2" fill="#FFCA35" opacity="0.5" transform="translate(582,38) rotate(45)" />
    <circle cx="238" cy="46" r="4" fill="#A9D0FF" opacity="0.45" />
    <circle cx="502" cy="362" r="5" fill="#A9D0FF" opacity="0.35" />
  </g>

  <!-- Sombra de piso -->
  <ellipse cx="322" cy="432" rx="210" ry="13" fill="#12264E" opacity="0.06" />

  <!-- Planta -->
  <g>
    <ellipse cx="120" cy="344" rx="13" ry="34" fill="#1479F5" stroke="#12264E" stroke-width="2" transform="rotate(-16 120 390)" />
    <ellipse cx="120" cy="340" rx="13" ry="38" fill="#A9D0FF" stroke="#12264E" stroke-width="2" transform="rotate(5 120 390)" />
    <ellipse cx="120" cy="346" rx="11" ry="32" fill="#1479F5" stroke="#12264E" stroke-width="2" opacity="0.9" transform="rotate(24 120 390)" />
    <polygon points="90,390 150,390 142,428 98,428" fill="#A9D0FF" stroke="#12264E" stroke-width="2.5" stroke-linejoin="round" />
    <rect x="85" y="384" width="65" height="12" rx="6" fill="#E7F3FF" stroke="#12264E" stroke-width="2" />
  </g>

  <!-- Pared del stand -->
  <g>
    <rect x="160" y="90" width="320" height="230" rx="28" fill="url(#reg-panel)" stroke="#12264E" stroke-width="3" />

    <!-- Marca Fexpo simplificada -->
    <rect x="-11" y="-11" width="22" height="22" rx="4" fill="#1479F5" transform="translate(320,124) rotate(45)" />
    <rect x="-10" y="-10" width="20" height="20" rx="4" fill="#A9D0FF" stroke="#12264E" stroke-width="1.5" transform="translate(300,156) rotate(45)" />
    <rect x="-10" y="-10" width="20" height="20" rx="4" fill="#FFCA35" transform="translate(340,156) rotate(45)" />

    <!-- Rótulos del stand -->
    <rect x="240" y="194" width="160" height="10" rx="5" fill="#FFFFFF" opacity="0.85" />
    <rect x="265" y="212" width="110" height="8" rx="4" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- Persona detrás del mostrador -->
  <g>
    <!-- brazo izquierdo (hacia la laptop) -->
    <path d="M362,212 Q332,232 322,268" stroke="#12264E" stroke-width="26" stroke-linecap="round" fill="none" />
    <path d="M362,212 Q332,232 322,268" stroke="#1479F5" stroke-width="20" stroke-linecap="round" fill="none" />
    <circle cx="320" cy="270" r="11" fill="#E7F3FF" stroke="#12264E" stroke-width="3" />

    <!-- brazo derecho -->
    <path d="M418,214 Q442,238 436,272" stroke="#12264E" stroke-width="26" stroke-linecap="round" fill="none" />
    <path d="M418,214 Q442,238 436,272" stroke="#1479F5" stroke-width="20" stroke-linecap="round" fill="none" />
    <circle cx="436" cy="274" r="11" fill="#E7F3FF" stroke="#12264E" stroke-width="3" />

    <!-- torso -->
    <rect x="350" y="195" width="80" height="110" rx="26" fill="#1479F5" stroke="#12264E" stroke-width="3" />
    <rect x="382" y="198" width="16" height="22" rx="4" fill="#FFCA35" stroke="#12264E" stroke-width="2" />

    <!-- cuello y cabeza -->
    <rect x="382" y="180" width="16" height="20" fill="#E7F3FF" stroke="#12264E" stroke-width="2.5" />
    <circle cx="390" cy="150" r="34" fill="#E7F3FF" stroke="#12264E" stroke-width="3" />
    <rect x="360" y="108" width="60" height="38" rx="19" fill="#12264E" />
    <circle cx="378" cy="152" r="3.5" fill="#12264E" />
    <circle cx="402" cy="152" r="3.5" fill="#12264E" />
    <path d="M378,164 Q390,172 402,164" stroke="#12264E" stroke-width="3" fill="none" stroke-linecap="round" />
  </g>

  <!-- Mostrador -->
  <g>
    <rect x="170" y="300" width="300" height="70" rx="14" fill="#A9D0FF" stroke="#12264E" stroke-width="3" />
    <rect x="162" y="288" width="316" height="18" rx="9" fill="#FFFFFF" stroke="#12264E" stroke-width="3" />
    <rect x="-9" y="-9" width="18" height="18" rx="3" fill="#FFFFFF" opacity="0.9" stroke="#12264E" stroke-width="1.5" transform="translate(320,335) rotate(45)" />
  </g>

  <!-- Laptop sobre el mostrador -->
  <g transform="rotate(-4 270 285)">
    <rect x="225" y="278" width="90" height="8" rx="4" fill="#12264E" />
    <rect x="235" y="228" width="70" height="52" rx="6" fill="#FFFFFF" stroke="#12264E" stroke-width="3" />
    <rect x="241" y="234" width="58" height="5" rx="2.5" fill="#A9D0FF" opacity="0.7" />
    <rect x="245" y="256" width="8" height="14" rx="2" fill="#A9D0FF" />
    <rect x="258" y="248" width="8" height="22" rx="2" fill="#1479F5" />
    <rect x="271" y="260" width="8" height="10" rx="2" fill="#FFCA35" />
  </g>

  <!-- Tarjeta flotante: perfil verificado -->
  <g transform="rotate(5 520 110)">
    <ellipse cx="520" cy="166" rx="75" ry="10" fill="#12264E" opacity="0.08" />
    <rect x="460" y="75" width="130" height="78" rx="18" fill="#FFFFFF" stroke="#12264E" stroke-width="2.5" />
    <circle cx="486" cy="104" r="15" fill="#A9D0FF" stroke="#12264E" stroke-width="2" />
    <circle cx="486" cy="100" r="5" fill="#12264E" />
    <path d="M478,113 Q486,105 494,113" stroke="#12264E" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <rect x="508" y="96" width="62" height="7" rx="3.5" fill="#12264E" opacity="0.8" />
    <rect x="508" y="108" width="42" height="6" rx="3" fill="#12264E" opacity="0.35" />
    <rect x="472" y="126" width="98" height="2" fill="#A9D0FF" opacity="0.6" />
    <circle cx="478" cy="138" r="4" fill="#1479F5" />
    <rect x="488" y="135" width="50" height="6" rx="3" fill="#12264E" opacity="0.25" />
    <circle cx="580" cy="82" r="14" fill="#1479F5" stroke="#FFFFFF" stroke-width="3" />
    <path d="M573,82 L578,87 L588,75" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Tarjeta flotante: visitas -->
  <g transform="rotate(-6 110 248)">
    <ellipse cx="110" cy="310" rx="62" ry="9" fill="#12264E" opacity="0.08" />
    <rect x="55" y="200" width="110" height="95" rx="18" fill="#FFFFFF" stroke="#12264E" stroke-width="2.5" />
    <rect x="70" y="214" width="55" height="7" rx="3.5" fill="#12264E" opacity="0.3" />
    <rect x="68" y="278" width="80" height="2" fill="#A9D0FF" opacity="0.6" />
    <rect x="72" y="252" width="16" height="26" rx="4" fill="#A9D0FF" />
    <rect x="96" y="236" width="16" height="42" rx="4" fill="#1479F5" />
    <rect x="120" y="260" width="16" height="18" rx="4" fill="#FFCA35" />
  </g>
</svg>
